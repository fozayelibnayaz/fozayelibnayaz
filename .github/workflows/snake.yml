name: generate-snake

# Draws the "snake eats your contribution graph" animation used at the bottom of the
# profile README. Output lands in the `output` branch as:
#   output/github-contribution-grid-snake.svg        (light)
#   output/github-contribution-grid-snake-dark.svg   (dark)
# The README references the dark one.

on:
  schedule:
    - cron: "0 0 * * *"        # every midnight UTC
  workflow_dispatch:           # manual "Run workflow" button
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
